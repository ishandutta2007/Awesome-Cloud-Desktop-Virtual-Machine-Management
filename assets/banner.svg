<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.35"/>
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(-15px, 10px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.25) translate(20px, -15px); opacity: 0.5; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }
    .orb-anim1 { animation: pulseOrb 7s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-anim2 { animation: pulseOrb2 9s ease-in-out infinite; transform-origin: 1000px 300px; }
    .card-float1 { animation: floatCard1 5s ease-in-out infinite; }
    .card-float2 { animation: floatCard2 6s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 6, 6; animation: dashStream 2s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)"/>

  <!-- Animated Glowing Atmospheric Orbs (Strictly in Background) -->
  <circle class="orb-anim1" cx="220" cy="120" r="160" fill="url(#glowGrad1)"/>
  <circle class="orb-anim2" cx="980" cy="280" r="180" fill="url(#glowGrad2)"/>

  <!-- Background Tech Lines & Network Links (Low Opacity) -->
  <g opacity="0.3" stroke="#6366f1" stroke-width="1.5">
    <path d="M 100 350 Q 300 380 600 350 T 1100 360" fill="none" class="stream-line"/>
    <path d="M 150 80 Q 500 40 850 70 T 1150 110" fill="none" stroke="#38bdf8" stroke-width="1.2" class="stream-line"/>
  </g>

  <!-- Decorative Background Pill / Node Badges (Non-overlapping) -->
  <g class="card-float1" opacity="0.85">
    <rect x="910" y="55" width="220" height="42" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="932" cy="76" r="6" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <text x="948" y="81" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🖥️ VDI &amp; Cloud Desktops</text>
  </g>

  <g class="card-float2" opacity="0.85">
    <rect x="930" y="115" width="200" height="42" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="952" cy="136" r="6" fill="#818cf8" filter="url(#subtleGlow)"/>
    <text x="968" y="141" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ GPU Virtualization</text>
  </g>

  <g class="card-float1" opacity="0.85">
    <rect x="910" y="175" width="220" height="42" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="932" cy="196" r="6" fill="#c084fc" filter="url(#subtleGlow)"/>
    <text x="948" y="201" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🌐 Browser CDI &amp; WebRTC</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Badges (Crisp & Unobscured) -->
  <g id="foreground-content" transform="translate(60, 0)">
    
    <!-- Top Category Pill -->
    <g transform="translate(0, 62)">
      <rect width="320" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
      <circle cx="16" cy="15" r="4" fill="#38bdf8"/>
      <text x="28" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM REPOSITORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Cloud Desktop &amp;
    </text>
    <text x="0" y="198" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Virtual Machine Management 🚀
    </text>

    <!-- Subtitle -->
    <text x="0" y="246" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
      The definitive directory for Virtual Desktop Infrastructure (VDI), Desktop-as-a-Service (DaaS),
    </text>
    <text x="0" y="272" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500">
      Type-1/Type-2 Hypervisors, GPU Workstations, Containerized Desktops &amp; WebRTC Streamers.
    </text>

    <!-- Interactive / Visual Feature Badges in Foreground -->
    <g transform="translate(0, 315)">
      <!-- Pill 1: SaaS / DaaS -->
      <g>
        <rect width="170" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="20" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">☁️ Enterprise DaaS</text>
      </g>
      <!-- Pill 2: Open-Source -->
      <g transform="translate(182, 0)">
        <rect width="180" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="20" y="24" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔓 Self-Hosted KVM/LXC</text>
      </g>
      <!-- Pill 3: Gaming & GPU -->
      <g transform="translate(374, 0)">
        <rect width="175" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="20" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎮 Low-Latency GPU</text>
      </g>
      <!-- Pill 4: Zero Trust -->
      <g transform="translate(561, 0)">
        <rect width="175" height="38" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="20" y="24" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛡️ Zero-Trust Gateways</text>
      </g>
    </g>

    <!-- Bottom Metadata Bar -->
    <g transform="translate(0, 385)">
      <circle cx="4" cy="-4" r="4" fill="#22c55e"/>
      <text x="16" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        Continuous Community Updates • Open to PRs &amp; Submissions • MIT Licensed
      </text>
    </g>
  </g>

  <!-- Border Accent Outline -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>